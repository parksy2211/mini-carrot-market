spring.application.name=carrot-backend

# ===============================
# Database (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/carrot_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=carrot_user
spring.datasource.password=carrot1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JWT ??
# ===============================
jwt.secret=change-this-to-a-long-random-secret-key-at-least-32-chars
jwt.access-exp-seconds=3600

# ===============================
# ngrok -> ?? 8080 ???
# ===============================
server.address=0.0.0.0
